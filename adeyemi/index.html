<style>
  :root { --ink:#0f172a; --muted:#64748b; --brand:#0b5cad; --brand2:#0a8f6a; --bg:#eef2f7; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background:var(--bg); color:var(--ink); min-height:100vh; display:flex; justify-content:center;
         align-items:flex-start; padding:24px 16px; }
  .card { width:100%; max-width:420px; background:#fff; border-radius:22px; overflow:hidden;
          box-shadow:0 12px 40px rgba(15,23,42,.12); }
  .banner { height:110px; background:linear-gradient(135deg,var(--brand),var(--brand2)); }
  .avatar { width:104px; height:104px; border-radius:50%; background:#fff; margin:-56px auto 0;
            display:flex; align-items:center; justify-content:center; border:5px solid #fff;
            box-shadow:0 4px 14px rgba(0,0,0,.12); }
  .avatar span { width:100%; height:100%; border-radius:50%; display:flex; align-items:center; justify-content:center;
                 background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; font-size:36px; font-weight:700; }
  .head { text-align:center; padding:14px 24px 6px; }
  h1 { font-size:22px; line-height:1.25; }
  .title { color:var(--brand); font-weight:600; margin-top:6px; }
  .company { color:var(--muted); font-size:14px; margin-top:2px; }
  .save { display:block; margin:20px 24px 8px; padding:15px; border:0; border-radius:14px; width:calc(100% - 48px);
          background:var(--ink); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  .save:active { transform:scale(.98); }
  .actions { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:8px 24px 6px; }
  .actions a { text-decoration:none; color:var(--ink); background:#f1f5f9; border-radius:12px; padding:12px 4px;
               text-align:center; font-size:13px; font-weight:600; }
  .actions a svg { display:block; margin:0 auto 6px; width:22px; height:22px; fill:var(--brand); }
  .list { padding:14px 24px 24px; }
  .row { display:flex; gap:14px; align-items:center; padding:13px 0; border-bottom:1px solid #eef2f7; }
  .row:last-child { border-bottom:0; }
  .row svg { width:20px; height:20px; fill:var(--muted); flex-shrink:0; }
  .row small { display:block; color:var(--muted); font-size:12px; }
  .row a, .row div > span { color:var(--ink); text-decoration:none; font-size:15px; word-break:break-all; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:0 0 20px; }
</style>

<script>
  const p = {"slug": "adeyemi", "name": "Adeyemi Oluwole", "fam": "Oluwole", "given": "Adeyemi", "mid": "", "phone": "+2348029334465", "email": "aoluwole@erltelecoms.com", "title": "Business Operations Manager", "company": "ERL Telecoms Services Limited"};
  document.getElementById('save').addEventListener('click', () => {
    const vcf = [
      'BEGIN:VCARD', 'VERSION:3.0',
      `N:${p.fam};${p.given};${p.mid};;`, `FN:${p.name}`,
      `ORG:${p.company}`, `TITLE:${p.title}`,
      `TEL;TYPE=CELL,VOICE:${p.phone}`, `EMAIL;TYPE=WORK,INTERNET:${p.email}`,
      'END:VCARD'
    ].join('\r\n');
    const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${p.given}_${p.fam}.vcf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  });
</script>
