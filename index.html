<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ERL Telecoms</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background:#eef2f7; color:#0f172a; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:420px; background:#fff; border-radius:22px; overflow:hidden; box-shadow:0 12px 40px rgba(15,23,42,.12); text-align:center; }
  .banner { height:90px; background:linear-gradient(135deg,#0b5cad,#0a8f6a); }
  h1 { font-size:22px; padding:24px 24px 6px; }
  p { color:#64748b; font-size:15px; padding:0 24px 28px; }
</style>
</head>
<body>
<main class="card">
  <div class="banner"></div>
  <h1>ERL Telecoms</h1>
  <p>Digital business cards</p>
</main>
</body>
</html>
